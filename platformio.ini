; PaperColor (SKU C151) — base env taken from M5Stack's published config.
; Note: there is no dedicated board definition, so esp32s3box is used as the base.

; Keeps bare `pio run` building just the two ESP32 envs, matching every
; existing doc/workflow reference to it -- [env:native] below is opt-in via
; `pio run -e native` so adding it doesn't change that default.
[platformio]
default_envs = m5stack-papercolor, m5stack-papercolor-test

[env:m5stack-papercolor]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; src/sdl_main.cpp is the [env:native] host entry point only -- it defines
; its own main()/setup()/loop() (would collide with main.cpp's) and only
; compiles against M5GFX's SDL backend, not this ESP32 target. Without this
; exclusion PlatformIO's default source filter picks it up here too and it
; fails on its own #error guard, then keeps emitting unrelated secondary
; errors afterward since GCC doesn't stop at #error. Confirmed 2026-09-16.
build_src_filter = +<*> -<sdl_main.cpp>

; Regenerates src/layout.h from layout.json before every build. Edit
; layout.json, not the generated header -- see tools/gen_layout_header.py.
extra_scripts = pre:tools/gen_layout_header.py

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    https://github.com/m5stack/M5Unified
    https://github.com/m5stack/M5GFX
    https://github.com/m5stack/M5PM1
    bblanchon/ArduinoJson @ ^7.0.0

; Tier 1 test harness: no Wi-Fi/NOAA/Open-Meteo fetch, no PM1 sleep, no panel
; refresh. setup() instead reads Snapshot JSON fixtures over USB CDC and
; dumps the rendered canvas buffer back over serial -- see TIER1_TEST in
; src/main.cpp and tools/hil.py. Gets its own build dir automatically
; (.pio/build/m5stack-papercolor-test/) since PlatformIO keys build dirs by
; env name.
[env:m5stack-papercolor-test]
extends = env:m5stack-papercolor
build_flags =
    ${env:m5stack-papercolor.build_flags}
    -DTIER1_TEST
    ; -DCORE_DEBUG_LEVEL=5 was tried and reverted (2026-09-05): raising it
    ; unlocks log_v()/log_d() calls framework-wide (I2C/SPI/PSRAM internals,
    ; not just M5GFX), and the resulting volume during the ~50s M5.begin()
    ; call overflowed even the 32KB TX buffer -- confirmed by losing even the
    ; previously-reliable esp32-hal-i2c.c i2cInit() line, which had shown up
    ; in every capture before this change. See the esp_log_level_set() call
    ; in TIER1_TEST's setup() for the scoped (M5GFX-tag-only) alternative.

; Host-side SDL preview (see CLAUDE.md's SDL-host-build entries): links the
; real M5GFX/LovyanGFX drawing code in src/render.cpp against M5GFX's own
; SDL backend, instead of tools/preview.py's separate PIL reimplementation
; of the same layout. Renders one fixture JSON (same format as
; test/fixtures/*.json) into a live window.
;
; Requires PlatformIO's `native` platform plus a working MinGW-w64 GCC +
; SDL2 dev toolchain (see https://docs.platformio.org/en/latest/platforms/
; native.html#installation). On this Windows dev machine that's MSYS2
; installed to the default C:\msys64, with:
;   pacman -S mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2
; The include/lib paths below point at that install; adjust them if MSYS2
; ever moves or a different toolchain (e.g. ucrt64) is used instead.
;
; `pio run -e native -t upload` both builds AND runs it -- PlatformIO's
; `native` platform maps "Upload" to "execute the built program". Point it
; at a different fixture with the SDL_PREVIEW_FIXTURE env var.
[env:native]
platform = native
build_type = debug
build_src_filter = -<*> +<render.cpp> +<sdl_main.cpp>
build_flags =
    ; mingw-w64's time.h only declares localtime_r() (used in render.cpp)
    ; when _POSIX_THREAD_SAFE_FUNCTIONS is defined -- unlike glibc, this
    ; isn't implied by -std=gnu++14 alone. Confirmed by build failure
    ; ("'localtime_r' was not declared") without it, 2026-09-16.
    -O0 -xc++ -std=gnu++14 -D_POSIX_THREAD_SAFE_FUNCTIONS
    -DM5GFX_BOARD=board_M5PaperColor
    -I"C:/msys64/mingw64/include/SDL2"
    -L"C:/msys64/mingw64/lib"
    -Dmain=SDL_main -lmingw32 -lSDL2main -lSDL2
lib_deps =
    https://github.com/m5stack/M5GFX
    bblanchon/ArduinoJson @ ^7.0.0
